<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --brand:#6366f1; --brand2:#8b5cf6; --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --ok:#10b981; --ok-bg:#ecfdf5; --ok-line:#a7f3d0; --bad:#ef4444; --bad-bg:#fef2f2; --bad-line:#fecaca;
  --warn:#f59e0b; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --r:16px; --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* ---------- HOME ---------- */
#home{padding:48px 0 64px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12px;font-weight:500;color:var(--muted);box-shadow:var(--shadow);margin-bottom:20px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.hero{text-align:center;margin-bottom:44px}
.hero h1{font-size:clamp(28px,5vw,38px);font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14px;margin-top:10px}
.session{margin-bottom:32px}
.session-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.session-head .em{width:46px;height:46px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.session-head h2{font-size:17px;font-weight:700}
.session-head p{font-size:12px;color:var(--faint)}
.card-list{display:grid;gap:12px}
.sub-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);transition:.25s;text-align:left;width:100%}
.sub-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(15,23,42,.12);border-color:#c7d2fe}
.sub-card .t{font-size:15px;font-weight:600}
.sub-card .m{font-size:12px;color:var(--faint);margin-top:3px}
.sub-card .go{color:var(--faint);font-size:14px;font-weight:600;transition:.25s}
.sub-card:hover .go{color:var(--brand);transform:translateX(3px)}
.foot{text-align:center;font-size:11px;color:var(--faint);margin-top:48px}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.topbar .exit{font-size:13px;color:var(--faint);font-weight:500;transition:.2s}
.topbar .exit:hover{color:var(--ink)}
.topbar-mid{text-align:center;flex:1}
.topbar-mid .n{font-size:12px;font-weight:600;color:var(--muted)}
.topbar-mid .c{font-size:11px;color:var(--faint)}
.timer{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;background:#f1f5f9;color:var(--muted)}
.timer.danger{background:var(--bad-bg);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.pbar{height:4px;background:#eef2f7}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:0 999px 999px 0;transition:width .4s}

/* ---------- QUIZ ---------- */
#quiz{padding:28px 0 120px}
.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:22px}
.passage .pt{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:10px}
.passage .px{font-size:13px;color:var(--muted);white-space:pre-line;max-height:260px;overflow-y:auto;line-height:1.7}
.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qnum{font-size:13px;font-weight:700;color:var(--faint)}
.qnum b{color:var(--ink)}
.flag{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--faint);transition:.2s}
.flag.on{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.qtext{font-size:17px;font-weight:600;line-height:1.6;white-space:pre-line;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;color:#334155;transition:.2s}
.opt:hover{border-color:#c7d2fe;background:#fafaff;transform:translateX(2px)}
.opt .ab{width:30px;height:30px;min-width:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--faint);transition:.2s}
.opt.sel{border-color:var(--brand);background:#f5f5ff;box-shadow:0 4px 14px rgba(99,102,241,.15)}
.opt.sel .ab{background:var(--grad);border-color:transparent;color:#fff}

/* bottom nav */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bottombar-in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.btn{border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;transition:.2s;border:1.5px solid var(--line);background:var(--card);color:var(--muted)}
.btn:hover:not(:disabled){background:#f8fafc;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--grad);color:#fff;border:none;flex:1;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.navgrid{max-width:760px;margin:0 auto;padding:0 20px 16px;display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.navgrid button{height:36px;border-radius:9px;font-size:12px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--faint);transition:.15s}
.navgrid button.done{background:var(--ok-bg);border-color:var(--ok-line);color:#047857}
.navgrid button.flg{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.navgrid button.cur{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- RESULT ---------- */
#result{padding:36px 0 72px}
.res-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px;margin-bottom:28px}
.res-top{text-align:center;margin-bottom:24px}
.res-top .lbl{font-size:12px;color:var(--faint)}
.ring{width:150px;height:150px;margin:16px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:38px;font-weight:800}
.ring .v span{font-size:10px;color:var(--faint);letter-spacing:.08em}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 .st{border-radius:14px;padding:16px 8px;text-align:center}
.stat3 .st b{display:block;font-size:24px;font-weight:800}
.stat3 .st span{font-size:11px;font-weight:500}
.st.ok{background:var(--ok-bg)} .st.ok b{color:var(--ok)} .st.ok span{color:#047857}
.st.bad{background:var(--bad-bg)} .st.bad b{color:var(--bad)} .st.bad span{color:#b91c1c}
.st.empty{background:#f1f5f9} .st.empty b{color:var(--muted)} .st.empty span{color:var(--muted)}
.res-actions{margin-top:22px;display:grid;gap:10px}
.rev-title{margin-bottom:6px}
.rev-title h2{font-size:19px;font-weight:800}
.rev-title p{font-size:12px;color:var(--faint);margin-top:4px}
.chips{display:flex;gap:8px;margin:16px 0 22px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--muted);transition:.2s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rev-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.rev-item.ok{border-color:var(--ok-line)} .rev-item.bad{border-color:var(--bad-line)}
.rev-head{display:flex;gap:12px;margin-bottom:12px}
.rev-ico{width:32px;height:32px;min-width:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.rev-ico.ok{background:var(--ok-bg);color:var(--ok)} .rev-ico.bad{background:var(--bad-bg);color:var(--bad)} .rev-ico.emp{background:#f1f5f9;color:var(--faint)}
.rev-head .no{font-size:11px;color:var(--faint);margin-bottom:3px}
.rev-head .qt{font-size:14.5px;font-weight:600;white-space:pre-line;line-height:1.55}
.rev-opts{display:grid;gap:6px;margin-bottom:14px}
.rev-opt{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 12px;border-radius:10px;color:var(--muted)}
.rev-opt.key{background:var(--ok-bg);color:#065f46;font-weight:600}
.rev-opt.usr{background:var(--bad-bg);color:#991b1b}
.rev-opt .lab{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.04em}
.rev-opt.key .lab{background:#a7f3d0;color:#065f46}
.rev-opt.usr .lab{background:#fecaca;color:#991b1b}
.exp{background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:14px 16px}
.exp .t{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:5px}
.exp .x{font-size:13.5px;color:var(--muted);line-height:1.65}
details.pass{margin-bottom:14px;font-size:12px}
details.pass summary{cursor:pointer;color:var(--faint);font-weight:500}
details.pass summary:hover{color:var(--brand)}
details.pass .inner{margin-top:8px;background:#f8fafc;border-radius:10px;padding:12px;white-space:pre-line;font-size:12px;color:var(--muted);line-height:1.65;max-height:200px;overflow-y:auto}
.fade-in{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:520px){.navgrid{grid-template-columns:repeat(8,1fr)}.stat3 .st b{font-size:20px}}
</style>
</head>

<script>
const PASSAGES = {
  wacana1: {
    title: "Teks 1",
    text: `Ketika Pemerintah memutuskan untuk menaikkan harga elpiji dan juga bensin pertamax, kita masih bisa memahami alasan bahwa kenaikan itu harus dilakukan karena komoditas itu lebih banyak dipergunakan masyarakat kelas atas. Namun ketika pemerintah menaikkan harga pupuk ZA dan SP-36, pantas kita bertanya apakah alasannya juga karena komoditas itu dipergunakan masyarakat kelas atas? Terus terang kita bertanya-tanya, ke mana sebetulnya arah keberpihakan pemerintah ini. Kita paham bahwa keuangan negara ini sangat terbatas dan tidak mungkin lagi untuk memberikan subsidi. Tetapi, apakah benar apabila kita kemudian sama sekali tidak mengenal subsidi lagi.

Pupuk jenis SP-36 dan ZA umumnya banyak dipakai oleh petani tebu dan hortikultura. Mereka umumnya bukanlah petani besar, tetapi petani gurem. Luas lahan yang mereka miliki sangatlah kecil sehingga mereka umumnya tergabung dalam Asosiasi Petani Tebu Rakyat Indonesia.

Ada dua hal yang membuat petani akan merasa diperlakukan tidak adil. Pertama, kenaikan dilakukan mulai 1 Januari jauh dari masa panen tiba. Artinya, petani harus keluar modal yang lebih banyak terlebih dahulu sebelum memetik hasilnya. Itu sama saja dengan kita meminta petani untuk memberikan subsidi kepada konsumen. Belum lagi tidak adanya jaminan bahwa pemerintah akan menetapkan harga dasar baru yang akan mengompensasi kerugian yang harus dihadapi petani. Sepanjang kondisinya seperti itu berlangsung, tidak usah heran apabila petani seumur-umur akan menjadi kelompok yang tertinggal karena nilai tukar mereka akan terus menurun.

Kedua adalah ketidakmampuan pemerintah untuk memberlakukan perdagangan yang adil (fair trade). Bukan sekali-dua kali terjadi penyelundupan gula. Dengan harga jual yang disubsidi ditambah lagi dengan tidak membayar bea masuk, jelas tidak mungkin sampai kapan pun produk petani kita akan mampu bersaing dengan produk impor.

(Sumber: Tajuk Rencana, Kompas 6 Januari 2005)`,
  },
  wacana2: {
    title: "Teks 2",
    text: `Berdasarkan perhatiannya terhadap orang dan perhatiannya terhadap kinerja, Sethia dan Glinow (dalam Collins dan Mc Laughlin, 1996: 760-762) membedakan adanya empat macam budaya organisasi, yaitu: (a) apathetic culture; (b) caring culture; (c) exacting culture; dan (d) integrative culture.

Dalam tipe apathetic culture, perhatian anggota organisasi terhadap hubungan antarmanusia maupun perhatian terhadap kinerja pelaksanaan tugas, dua-duanya rendah. Di sini penghargaan diberikan terutama berdasarkan permainan politik dan pemanipulasian orang-orang lain. Sedangkan budaya organisasi caring culture dicirikan oleh rendahnya perhatian terhadap kinerja dan tingginya perhatian terhadap hubungan antarmanusia. Penghargaan lebih didasarkan atas kepaduan tim dan harmoni, dan bukan didasarkan atas kinerja pelaksanaan tugas. Sementara itu ciri utama tipe exacting culture adalah bahwa perhatian terhadap orang sangat rendah, tetapi perhatian terhadap kinerja sangat tinggi. Di sini secara ekonomis, penghargaan sangat memuaskan, tetapi hukuman atas kegagalan yang dilakukan juga sangat berat. Dengan demikian tingkat keamanan pekerjaan menjadi sangat rendah. Yang terakhir, dalam organisasi yang memiliki budaya integratif maka perhatian terhadap orang maupun perhatian terhadap kinerja keduanya sangat tinggi.

Apabila organisasi-organisasi publik di Indonesia dianalisis dengan menggunakan empat tipe budaya tersebut di atas maka dapat disimpulkan bahwa sebagian besar organisasi publik memiliki budaya organisasi yang bertipe caring. Organisasi-organisasi publik di Indonesia biasanya memiliki perhatian yang sangat rendah terhadap kinerja pelaksanaan tugas, tetapi memiliki perhatian yang sangat tinggi terhadap hubungan antarmanusia. Hal ini nampak dari ciri-ciri birokrat sebagai berikut: (a) lebih mementingkan kepentingan pimpinan ketimbang kepentingan klien atau pengguna jasa; (b) lebih merasa sebagai abdi negara daripada abdi masyarakat; (c) meminimalkan risiko dengan cara menghindari inisiatif; (d) menghindari tanggung jawab; (e) menolak tantangan; dan (f) tidak suka berkreasi dan berinovasi dalam melaksanakan tugas-tugasnya. Budaya caring ini tidak cocok dalam pemberian pelayanan yang berkualitas kepada masyarakat. Dengan demikian harus diadopsi budaya organisasi baru yang lebih sesuai dan kondusif dengan manajemen pelayanan publik. Budaya organisasi seperti ini disebut kultur kinerja (Ivancevich, Lorenzi, Skinner & Cmsby 1997: 460).

(Sumber: Dikutip dengan perubahan seperlunya dari Ratminto & Winarsih (2005); Manajemen Pelayanan.)`,
  },
  anal1: {
    title: "Teks untuk soal 21–26",
    text: `Toni memiliki sebuah rak buku kecil yang terbagi atas lima tingkat: tingkat 1, 2, 3, 4, dan 5. Tingkat 1 adalah yang teratas dan tingkat 5 adalah yang terbawah. Toni menyimpan buku-buku pelajarannya ke dalam rak dengan aturan sebagai berikut:
(1) Buku pelajaran Matematika disimpan tepat di atas buku pelajaran Geografi, sedangkan buku pelajaran Ekonomi diletakkan tepat di bawah buku Geografi.
(2) Buku pelajaran Bahasa Indonesia diletakkan di atas buku pelajaran Fisika, sedangkan buku pelajaran Fisika dan Kimia berada di atas buku pelajaran Matematika.
(3) Buku pelajaran Kimia dan Biologi diletakkan saling terpisah sejauh mungkin.`,
  },
  anal2: {
    title: "Teks untuk soal 27–31",
    text: `A, B, C, D, dan E adalah lima pekerja yang mencalonkan diri menjadi ketua serikat pekerja. Ada tiga program yang diajukan para calon, yaitu (i) program peningkatan keterampilan pekerja oleh A, B, dan C; (ii) program olahraga oleh B, C, dan D; (iii) program peningkatan kesejahteraan oleh D, E, dan A. Setiap warga hanya diperkenankan memilih satu calon berdasarkan programnya. Hasil pemungutan suara adalah sebagai berikut:
(1) 60 pekerja memilih program peningkatan keterampilan pekerja.
(2) 45 pekerja memilih program olahraga.
(3) 90 pekerja memilih program peningkatan kesejahteraan.
(4) Jumlah suara terbagi sama besar pada calon-calon yang memiliki program sama.`,
  },
  anal3: {
    title: "Teks untuk soal 32–34",
    text: `Seorang calon legislatif melakukan kampanye pada lima kecamatan, yaitu J, K, L, M, dan N dengan ketentuan sebagai berikut:
(1) Ia dapat berkunjung ke kecamatan M jika telah ke L dan N.
(2) Ia tidak bisa mengunjungi kecamatan N sebelum mengunjungi kecamatan J.
(3) Kecamatan kedua yang harus dikunjungi adalah K.`,
  },
  anal4: {
    title: "Teks untuk soal 35–38",
    text: `Pada suatu jamuan makan malam, 8 orang eksekutif muda (Aga, Didi, Lala, Laura, Gael, Michael, Rani, dan Togi) duduk mengelilingi satu meja bundar.
(1) Gael duduk berseberangan dengan Aga.
(2) Michael duduk di antara Togi dan Lala.
(3) Laura dan Lala duduk tepat berhadapan.
(4) Togi duduk 2 kursi terpisah dari Aga.`,

      { q: "Berapakah bilangan bulat terkecil yang merupakan penjumlahan dari tiga bilangan prima berbeda yang masing-masing lebih dari 6?", o: ["10", "22", "30", "31", "47"], a: 3, e: "Tiga prima terkecil > 6 adalah 7, 11, 13. Jumlah = 31." },
      { q: "Sebuah roda berdiameter 17 inci berputar 200 kali untuk menempuh jarak tertentu. Jika roda berdiameter 25 inci menempuh jarak sama, berapa putaran roda kedua?", o: ["136 putaran", "132 putaran", "129 putaran", "126 putaran", "125 putaran"], a: 0, e: "17 × 200 = 25 × x → x = 136 putaran." },
      { q: "Toko Akbar membuat 112 pasang sepatu dalam 16 hari, Toko Sakti 99 pasang dalam 9 hari. Jika bekerja sama, berapa waktu untuk membuat 279 pasang sepatu?", o: ["16 hari", "20 hari", "25 hari", "28 hari", "31 hari"], a: 0, e: "Akbar = 7/hari, Sakti = 11/hari. Bersama 18/hari. 279 : 18 = 15,5 ≈ 16 hari." },
      { q: "Perbandingan nilai ujian Rama dan Sinta adalah 1 : 3. Jika jumlah nilai mereka 20, berapakah masing-masing nilai Rama dan Sinta?", o: ["Rama 5 dan Sinta 15", "Rama 15 dan Sinta 5", "Rama 12,5 dan Sinta 7,5", "Rama 7,5 dan Sinta 12,5", "Rama 10 dan Sinta 10"], a: 0, e: "Rama = 1/4 × 20 = 5, Sinta = 3/4 × 20 = 15." },
      { q: "Tiang A tinggi 3 m menghasilkan bayangan 4,1 m. Tiang B mempunyai bayangan 2 m, berapakah tinggi tiang B sebenarnya?", o: ["1,79 m", "1,61 m", "1,55 m", "1,46 m", "1,32 m"], a: 3, e: "3/4,1 = x/2 → x = 6/4,1 = 1,46 m." },
      { q: "Ayah memiliki Rp380.000. Ia memberi uang ke tiga anak masing-masing Rp45.000, membeli peralatan memancing Rp160.000 dan umpan Rp5.000. Berapa sisa uang Ayah?", o: ["Rp100.000", "Rp80.000", "Rp78.900", "Rp50.080", "Rp44.000"], a: 1, e: "Pengeluaran = 135.000 + 160.000 + 5.000 = 300.000. Sisa = 380.000 − 300.000 = Rp80.000." },
      { q: "Jumlah dua bilangan adalah 25. Jika yang besar dibagi yang kecil hasilnya 7 dan sisanya 1, selisih kedua bilangan tersebut adalah ...", o: ["19", "20", "21", "22", "23"], a: 0, e: "a + b = 25, a = 7b + 1 → b = 3, a = 22. Selisih = 22 − 3 = 19." },
      { q: "Handoko menabung Rp340.000 dan mendapat bunga 0,3% per bulan. Tentukan besar tabungan Handoko setelah setahun ...", o: ["Rp352.240", "Rp355.000", "Rp367.909", "Rp370.000", "Rp387.000"], a: 0, e: "Bunga/bulan = 1.020; setahun = 12.240. Tabungan = 340.000 + 12.240 = Rp352.240." },
      { q: "Pak Yadi memiliki tanah persegi panjang dengan luas 735 m² dan lebar 35 m. Berapakah panjang tanah tersebut?", o: ["11 m", "18 m", "21 m", "26 m", "29 m"], a: 2, e: "Panjang = 735 : 35 = 21 m." },
      { q: "Dalam ujian, Ady tidak dapat menjawab 12 pertanyaan. Jika Ady mendapat nilai 50%, berapakah jumlah soal seluruhnya?", o: ["10 soal", "20 soal", "24 soal", "30 soal", "35 soal"], a: 2, e: "(n − 12)/n = 50% → 50n = 100n − 1.200 → n = 24 soal." },
      { q: "Jika luas sebuah lingkaran adalah sembilan kali luas lingkaran lainnya, berapakah perbandingan jari-jari lingkaran besar terhadap jari-jari lingkaran kecil?", o: ["1 : 2", "2 : 1", "3 : 1", "3 : 6", "4 : 2"], a: 2, e: "(r₁/r₂)² = 9 → r₁ : r₂ = 3 : 1." },
      { q: "Jika 11^x = 1.331 dan 9^y = 6.561, manakah pernyataan berikut yang benar?", o: ["x < y", "x > y", "x = y", "x dan y tak bisa ditentukan", "xy < y"], a: 0, e: "11³ = 1.331 → x = 3; 9⁴ = 6.561 → y = 4. Jadi x < y." },
      { q: "Seorang pedagang membeli gula 5 karung, masing-masing 1 kuintal, harga setiap karung Rp100.000. Jual Rp1.500/kg. Besar keuntungannya adalah ...", o: ["Rp220.000", "Rp235.000", "Rp240.000", "Rp245.000", "Rp250.000"], a: 4, e: "Harga beli = 500.000. Harga jual = 1.500 × 500 kg = 750.000. Untung = Rp250.000." },
      { q: "Jika x rupiah dibagi rata kepada n orang, setiap orang memperoleh Rp180.000. Jika dua orang lagi bergabung, setiap orang memperoleh Rp150.000. Berapa rupiah uang itu?", o: ["Rp1.700.000", "Rp1.750.000", "Rp1.800.000", "Rp1.850.000", "Rp1.900.000"], a: 2, e: "180.000n = 150.000(n + 2) → 30.000n = 300.000 → n = 10. x = 180.000 × 10 = Rp1.800.000." },
      { q: "Sebuah hotel merencanakan membeli lemari dan kasur. Jumlah kedua barang 140 buah dan jumlah kasur 6 kali lebih banyak dari jumlah lemari. Berapakah jumlah kasur?", o: ["110 buah", "115 buah", "120 buah", "125 buah", "130 buah"], a: 2, e: "6y + y = 140 → y = 20 lemari, kasur = 6 × 20 = 120." },
      { q: "Kantor Indri berjarak 10 km dari rumahnya. Jika Indri berjalan 4 km setiap jam, berapa waktu yang dibutuhkan untuk berjalan pulang-pergi selama seminggu?", o: ["30 jam", "32 jam", "33 jam", "34 jam", "35 jam"], a: 4, e: "t = 7 × (20/4) = 35 jam." },
      { q: "Nilai ujian praktik Andi urutan 20 dari atas dan urutan 19 dari bawah. Berapa jumlah siswa dalam kelas tersebut?", o: ["36 siswa", "37 siswa", "38 siswa", "39 siswa", "40 siswa"], a: 2, e: "19 + 18 + 1 = 38 siswa." },
      { q: "Dua roda berputar bersamaan dengan kecepatan berbeda. Saat roda pertama berputar 12 kali, roda kedua 15 kali. Jika roda pertama berputar 32 kali, berapa putaran roda kedua?", o: ["36 kali", "38 kali", "40 kali", "42 kali", "44 kali"], a: 2, e: "12x = 32 × 15 → x = 480/12 = 40 kali." },
      { q: "Doni menjual baju dengan harga Rp120.000 dan memperoleh laba 20% dari harga beli. Berapakah modal awal barang tersebut?", o: ["Rp100.000", "Rp110.000", "Rp120.000", "Rp130.000", "Rp140.000"], a: 0, e: "Modal = 100%/120% × 120.000 = Rp100.000." },
      { q: "Sebuah lemari mempunyai panjang 28 cm, lebar 15 cm, dan tinggi 18 cm. Berapakah volume lemari tersebut?", o: ["7.540 cm³", "7.550 cm³", "7.560 cm³", "7.570 cm³", "7.580 cm³"], a: 2, e: "V = 28 × 15 × 18 = 7.560 cm³." },
      { q: "Sebuah toko souvenir mendapat pesanan 8 kodi gelang dan setiap gelang membutuhkan 15 mutiara. Berapa lusin mutiara yang dibutuhkan?", o: ["190 lusin", "200 lusin", "210 lusin", "220 lusin", "230 lusin"], a: 1, e: "8 kodi = 160 gelang. Mutiara = 160 × 15 = 2.400 = 200 lusin." },
      { q: "Toko Ibu Tina menjual 40 bungkus sabun dan sampo. Harga 1 sabun Rp2.000 dan 1 sampo Rp4.000. Jika uang yang diterima Rp200.000, jumlah sampo yang terjual adalah ...", o: ["55 buah", "57 buah", "59 buah", "60 buah", "63 buah"], a: 3, e: "2.000(40 − y) + 4.000y = 200.000 → 2.000y = 120.000 → y = 60 buah." },

  {

      { q: "Jika udara tidak tercemar maka rumah segar. Jika rumah segar maka kupu-kupu bertelur. Simpulan:", o: ["Jika udara tercemar maka kupu-kupu bertelur", "Jika udara tidak tercemar maka kupu-kupu bertelur", "Jika udara tidak tercemar maka kupu-kupu tidak bertelur", "Jika udara tidak tercemar maka bukan kupu-kupu bertelur", "Jika bukan udara yang tercemar maka kupu-kupu tidak bertelur"], a: 1, e: "Silogisme: tidak tercemar → segar → bertelur." },

      { q: "Semua palang adalah kayu. Beberapa kayu sangat berat. Simpulan:", o: ["Semua palang sangat berat", "Semua kayu adalah palang", "Sebagian palang bukan kayu", "Semua yang sangat berat adalah palang", "Sebagian yang sangat berat bukan palang"], a: 4, e: "Kayu yang berat belum tentu palang, jadi sebagian yang sangat berat bukan palang." },

      { q: "Jika merasa bingung maka harus berdiri. Jika berdiri maka perlu mengangkat tangan. Simpulan:", o: ["Sebagian yang berdiri merasa bingung", "Semua yang mengangkat tangan tidak berdiri", "Semua yang merasa bingung mengangkat tangan", "Semua yang mengangkat tangan tentu bingung", "Sebagian yang merasa bingung mengangkat tangan"], a: 2, e: "Silogisme: bingung → berdiri → mengangkat tangan." },
      { q: "Hewan golongan unggas berkembang biak dengan cara bertelur. Buaya, hewan bukan unggas yang berkembang biak dengan cara bertelur. Simpulan yang tepat tentang buaya:", o: ["Memiliki cara berkembang biak yang tidak sama dengan unggas", "Memiliki ciri-ciri yang sama dengan unggas", "Memiliki cara berkembang biak yang sama dengan unggas", "Memiliki telur yang sama dengan golongan unggas", "Memiliki cara bertelur yang sama dengan unggas"], a: 2, e: "Buaya berkembang biak dengan cara bertelur, sama dengan unggas." },
      { q: "Semua pelaut adalah perenang. Sebagian perenang bukan penyelam. Simpulan yang tepat:", o: ["Semua penyelam adalah pelaut", "Sebagian pelaut bukan penyelam", "Sebagian penyelam bukan perenang", "Semua pelaut adalah penyelam", "Semua penyelam bukan pelaut"], a: 1, e: "Perenang yang bukan penyelam mungkin saja pelaut, jadi sebagian pelaut bukan penyelam." },
      { q: "Semua calon mahasiswa menempuh tes Matematika. Sebagian calon mahasiswa memiliki skor TOEFL di atas 450. Simpulan yang tepat:", o: ["Sebagian calon mahasiswa yang tidak memiliki skor TOEFL menempuh tes Matematika", "Semua calon mahasiswa yang memiliki skor TOEFL tidak menempuh tes Matematika", "Semua calon mahasiswa yang tidak memiliki skor TOEFL tidak menempuh tes Matematika", "Sebagian calon mahasiswa yang memiliki skor TOEFL tidak menempuh tes Matematika", "Semua calon mahasiswa yang menempuh tes Matematika tidak memiliki skor TOEFL"], a: 2, e: "Semua calon mahasiswa (termasuk yang tidak punya skor TOEFL) menempuh tes Matematika; sesuai kunci: pernyataan C." },
      { q: "Makhluk laut yang bernapas dengan insang adalah ikan. Lumba-lumba adalah makhluk laut yang bernapas dengan paru-paru. Simpulan:", o: ["Semua lumba-lumba termasuk jenis ikan yang hidup di laut", "Semua lumba-lumba dan ikan adalah makhluk yang hidup di laut", "Sebagian lumba-lumba termasuk jenis ikan yang hidup di laut", "Semua ikan termasuk jenis lumba-lumba yang hidup di laut", "Sebagian ikan termasuk jenis lumba-lumba yang hidup di laut"], a: 0, e: "Sesuai kunci pembahasan: semua lumba-lumba termasuk jenis ikan yang hidup di laut." },

      { q: "Semua tanaman memiliki buah. Ada tanaman berbunga merah. Simpulan:", o: ["Semua tanaman yang memiliki buah berbunga bukan merah", "Semua tanaman yang memiliki buah berbunga merah", "Semua tanaman yang tidak memiliki buah berbunga bukan merah", "Ada tanaman yang tidak memiliki buah berbunga merah", "Ada tanaman yang memiliki buah, berbunga bukan merah"], a: 4, e: "Ada tanaman berbunga merah (semua punya buah), jadi ada tanaman berbunga bukan merah yang memiliki buah." },

      { q: "Urutan perolehan tiga suara terbanyak dari yang terbanyak adalah ...", o: ["ADB", "ABC", "CAB", "DBE", "ECA"], a: 0, e: "Urutan: A (50), D (45), B (35) → ADB.", pass: "anal2" },
      { q: "Jika ketua terpilih mengangkat ketua seksi olahraga dari calon yang memperoleh suara terbanyak dan mengajukan program olahraga, ketua seksi olahraga adalah ...", o: ["A", "B", "C", "D", "E"], a: 3, e: "Di antara pemilih program olahraga (B, C, D), suara terbanyak adalah D.", pass: "anal2" },
      { q: "Kecamatan yang pertama harus dikunjungi adalah ...", o: ["Kecamatan J", "Kecamatan K", "Kecamatan L", "Kecamatan M", "Kecamatan N"], a: 0, e: "Urutan yang tepat: J, K, N, L, M. Yang pertama adalah J (N butuh J lebih dulu; kedua adalah K).", pass: "anal3" },
      { q: "Dua kecamatan yang dapat dikunjungi setelah kecamatan N adalah ...", o: ["Kecamatan J dan K", "Kecamatan L dan M", "Kecamatan M dan J", "Kecamatan N dan K", "Kecamatan K dan L"], a: 1, e: "Setelah N, yang dapat dikunjungi adalah L dan M.", pass: "anal3" },
      { q: "Rencana kunjungan yang sebaiknya dipilih agar lima kecamatan dapat dikunjungi adalah ...", o: ["J, K, N, L, M", "K, J, L, N, M", "K, M, L, J, N", "L, K, J, N, M", "L, K, N, J, M"], a: 0, e: "Urutan yang memenuhi semua syarat: J → K → N → L → M.", pass: "anal3" },
      { q: "Pernyataan di bawah ini yang tidak benar adalah ...", o: ["Laura duduk di antara Rani dan Gael", "Lala dan Didi dipisahkan oleh Aga", "Michael duduk di antara Togi dan Lala", "Laura dipisahkan 2 kursi dengan Aga", "Didi duduk di antara Gael dan Togi"], a: 4, e: "Berdasarkan susunan tempat duduk, yang tidak mungkin adalah Didi duduk di antara Gael dan Togi.", pass: "anal4" },
      { q: "Bila Michael dipisahkan 2 kursi dengan Didi, pernyataan yang benar adalah ...", o: ["Michael dan Rani dipisahkan oleh 2 kursi", "Michael dan Aga duduk berseberangan", "Didi dan Togi duduk berhadapan", "Lala duduk di sebelah Gael", "Rani duduk di dekat Togi"], a: 2, e: "Dengan kondisi tersebut, Didi dan Togi duduk tepat berhadapan.", pass: "anal4" },
      { q: "Bila Michael dan Rani duduk berseberangan, pernyataan yang benar adalah ...", o: ["Gael duduk berhadapan dengan Didi", "Gael duduk di sebelah Michael", "Lala duduk di sebelah Didi", "Rani duduk di antara Laura dan Didi", "Didi duduk di antara Aga dan Lala"], a: 3, e: "Rani duduk di antara Laura dan Didi.", pass: "anal4" },
      { q: "Pernyataan di bawah ini yang benar adalah ...", o: ["Didi duduk di antara Gael dan Togi", "Rani duduk dipisahkan 2 kursi dengan Togi", "Rani dan Didi duduk tepat berseberangan", "Togi duduk di seberang Rani", "Michael duduk berhadapan dengan Didi"], a: 4, e: "Pernyataan yang selalu benar: Michael duduk berhadapan dengan Didi.", pass: "anal4" },
      { q: "Tiga karyawan perokok seharusnya ditempatkan di ruang nomor ...", o: ["1, 2, dan 4", "2, 3, dan 6", "1, 2, dan 3", "2, 3, dan 4", "1, 2, dan 6"], a: 2, e: "Urutan yang sesuai: 1. Tasman, 2. Dedi, 3. Mara, 4. Bono, 5. Heni, 6. Rati. Perokok (Tasman, Dedi, Mara) di ruang 1, 2, 3.", pass: "anal5" },
      { q: "Ruang kerja yang paling cocok untuk Pak Mara adalah ruang nomor ...", o: ["2", "6", "1", "3", "4"], a: 3, e: "Pak Mara perokok yang harus berdekatan dengan Pak Bono (ruang 4) dan jauh dari Bu Heni (ruang 5), jadi ruang 3.", pass: "anal5" },
    ],
  },
];
const HURUF = ["A","B","C","D","E"];
let sub = null, idx = 0, answers = {}, flags = {}, timeLeft = 0, timerId = null, showNav = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = (sec) => `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
const show = (id) => { ["home","quiz","result"].forEach(v=>$(v).classList.add("hidden")); $(id).classList.remove("hidden"); $(id).classList.add("fade-in"); window.scrollTo(0,0); };

const SESI_INFO = {
  "Tes Kemampuan Verbal": ["📖","Sinonim, antonim, analogi, pengelompokan kata & wacana"],
  "Tes Kemampuan Numerik": ["🔢","Deret, matematika berpola, aritmetika-aljabar & soal cerita"],
  "Tes Kemampuan Penalaran": ["🧠","Penalaran logis & penalaran analitis"],
};
function renderHome(){
  const groups = {};
  SUBTES.forEach(s => { (groups[s.sesi] = groups[s.sesi] || []).push(s); });
  let html = "";
  Object.entries(groups).forEach(([nama, subs]) => {
    html += `<div class="session"><div class="session-head"><div class="em">${SESI_INFO[nama][0]}</div><div><h2>${nama}</h2><p>${SESI_INFO[nama][1]}</p></div></div><div class="card-list">`;
    subs.forEach(s => {
      html += `<button class="sub-card" onclick="startQuiz('${s.id}')"><div><div class="t">${s.nama}</div><div class="m">${s.soal.length} soal · ${s.waktuMenit} menit</div></div><span class="go">Mulai &rarr;</span></button>`;
    });
    html += `</div></div>`;
  });
  $("home-list").innerHTML = html;
}

function startQuiz(id){
  sub = SUBTES.find(s => s.id === id);
  idx = 0; answers = {}; flags = {}; showNav = false;
  timeLeft = sub.waktuMenit * 60;
  $("qz-name").textContent = sub.nama;
  $("qz-tot").textContent = " / " + sub.soal.length;
  $("navgrid").classList.add("hidden"); $("btn-nav").textContent = "Nomor";
  show("quiz");
  renderQ(); startTimer();
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) { clearInterval(timerId); finishQuiz(); return; }
    updateTimer();
  }, 1000);
  updateTimer();
}
function updateTimer(){
  const t = $("qz-timer");
  t.textContent = fmt(Math.max(0,timeLeft));
  t.classList.toggle("danger", timeLeft < 60);
}
function renderQ(){
  const q = sub.soal[idx];
  const pass = q.pass ? PASSAGES[q.pass] : null;
  const pEl = $("qz-passage");
  if (pass){ pEl.classList.remove("hidden"); pEl.innerHTML = `<div class="pt">${pass.title}</div><div class="px">${esc(pass.text)}</div>`; }
  else pEl.classList.add("hidden");
  $("qz-cur").textContent = idx + 1;
  const f = flags[idx];
  $("qz-flag").classList.toggle("on", !!f);
  $("qz-flag").textContent = f ? "★ Ditandai" : "☆ Tandai";
  $("qz-text").innerHTML = esc(q.q);
  $("qz-opts").innerHTML = q.o.map((o,i) =>
    `<button class="opt ${answers[idx]===i?"sel":""}" onclick="pick(${i})"><span class="ab">${HURUF[i]}</span><span>${esc(o)}</span></button>`).join("");
  $("btn-prev").disabled = idx === 0;
  const last = idx === sub.soal.length - 1;
  $("btn-next").textContent = last ? "Selesai & Lihat Hasil" : "Lanjut →";
  const done = Object.keys(answers).length;
  $("qz-count").textContent = `Terjawab ${done}/${sub.soal.length}`;
  $("qz-prog").style.width = (done / sub.soal.length * 100) + "%";
  if (showNav) renderNavGrid();
  window.scrollTo(0,0);
}
function pick(i){ answers[idx] = i; renderQ(); }
function toggleFlag(){ flags[idx] = !flags[idx]; renderQ(); }
function nav(d){ idx = Math.max(0, Math.min(sub.soal.length - 1, idx + d)); renderQ(); }
function navNext(){ if (idx === sub.soal.length - 1) finishQuiz(); else nav(1); }
function toggleNav(){
  showNav = !showNav;
  $("navgrid").classList.toggle("hidden", !showNav);
  $("btn-nav").textContent = showNav ? "Tutup" : "Nomor";
  if (showNav) renderNavGrid();
}
function renderNavGrid(){
  $("navgrid").innerHTML = sub.soal.map((_,i) => {
    let cls = "cur";
    if (i !== idx) cls = answers[i] !== undefined ? "done" : (flags[i] ? "flg" : "");
    return `<button class="${cls}" onclick="gotoQ(${i})">${i+1}</button>`;
  }).join("");
}
function gotoQ(i){ idx = i; renderQ(); }
function exitQuiz(){ clearInterval(timerId); show("home"); }
function finishQuiz(){ clearInterval(timerId); renderResult(); show("result"); }

let filter = "semua";
function renderResult(){
  const total = sub.soal.length;
  const benar = sub.soal.filter((q,i) => answers[i] === q.a).length;
  const salah = sub.soal.filter((q,i) => answers[i] !== undefined && answers[i] !== q.a).length;
  const kosong = total - benar - salah;
  const skor = Math.round(benar / total * 100);
  const pct = skor / 100, C = 2 * Math.PI * 62;
  const items = sub.soal.map((q,i) => ({q,i}))
    .filter(({q,i}) => filter === "salah" ? (answers[i] !== undefined && answers[i] !== q.a)
      : filter === "kosong" ? answers[i] === undefined : true)
    .map(({q,i}) => {
      const ua = answers[i], ok = ua === q.a;
      const opts = q.o.map((o,oi) => {
        const isKey = oi === q.a, isUsr = ua === oi;
        return `<div class="rev-opt ${isKey?"key":""} ${isUsr&&!isKey?"usr":""}"><span style="font-weight:700;width:14px;font-size:11px">${HURUF[oi]}</span><span style="flex:1">${esc(o)}</span>${isKey?'<span class="lab">KUNCI</span>':""}${isUsr&&!isKey?'<span class="lab">JAWABANMU</span>':""}</div>`;
      }).join("");
      const pass = q.pass ? `<details class="pass"><summary>Lihat ${PASSAGES[q.pass].title}</summary><div class="inner">${esc(PASSAGES[q.pass].text)}</div></details>` : "";
      return `<div class="rev-item ${ok?"ok":(ua!==undefined?"bad":"")}">
        <div class="rev-head"><span class="rev-ico ${ok?"ok":(ua!==undefined?"bad":"emp")}">${ok?"✓":(ua!==undefined?"✕":"–")}</span>
        <div style="flex:1"><div class="no">Soal ${i+1}</div><div class="qt">${esc(q.q)}</div></div></div>
        ${pass}<div class="rev-opts">${opts}</div>
        ${ua===undefined?'<div style="font-size:11px;color:var(--faint);margin:-6px 0 12px 8px">Kamu tidak menjawab soal ini.</div>':""}
        <div class="exp"><div class="t">💡 Penjelasan</div><div class="x">${esc(q.e)}</div></div></div>`;
    }).join("");
  $("result").innerHTML = `
    <button class="btn" style="margin-bottom:22px" onclick="show('home');window.scrollTo(0,0)">&larr; Kembali ke daftar subtes</button>
    <div class="res-card fade-in">
      <div class="res-top">
        <div class="lbl">${sub.sesi} · ${sub.nama}</div>
        <div class="ring">
          <svg width="150" height="150"><circle cx="75" cy="75" r="62" fill="none" stroke="#eef2f7" stroke-width="10"/>
          <circle cx="75" cy="75" r="62" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
          <div class="v"><b>${skor}</b><span>SKOR / 100</span></div>
        </div>
      </div>
      <div class="stat3">
        <div class="st ok"><b>${benar}</b><span>Benar</span></div>
        <div class="st bad"><b>${salah}</b><span>Salah</span></div>
        <div class="st empty"><b>${kosong}</b><span>Kosong</span></div>
      </div>
      <div class="res-actions">
        <button class="btn primary" style="width:100%" onclick="startQuiz('${sub.id}')">Ulangi Subtes Ini</button>
      </div>
    </div>
    <div class="rev-title"><h2>Kunci Jawaban &amp; Penjelasan</h2><p>Jawaban benar ditandai hijau, jawabanmu ditandai merah (jika salah).</p></div>
    <div class="chips">
      <button class="chip ${filter==="semua"?"on":""}" onclick="setFilter('semua')">Semua (${total})</button>
      <button class="chip ${filter==="salah"?"on":""}" onclick="setFilter('salah')">Salah (${salah})</button>
      <button class="chip ${filter==="kosong"?"on":""}" onclick="setFilter('kosong')">Kosong (${kosong})</button>
    </div>
    <div>${items || '<p style="color:var(--faint);font-size:13px;padding:20px 0">Tidak ada soal pada filter ini. 🎉</p>'}</div>`;
}
function setFilter(f){ filter = f; renderResult(); window.scrollTo(0,0); }

renderHome();
</script>
</body>
</html>
